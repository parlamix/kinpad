name: Accessibility report
description: Report an accessibility barrier in KinPad
title: "[Accessibility] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the barrier without including private document content or unredacted personal information.
  - type: input
    id: kinpad-version
    attributes:
      label: KinPad version
      placeholder: 2026.9.1
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: Barrier
      description: What could not be completed or understood?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Assistive setup
      description: Name relevant assistive technology, input method, zoom, contrast, or display settings.
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private and sensitive information.
          required: true
