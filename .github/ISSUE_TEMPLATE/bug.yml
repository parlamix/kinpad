name: Bug report
description: Report a reproducible KinPad problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve KinPad. Do not include document text, recovery files, credentials, private keys, tokens, private paths, or unredacted screenshots.

        Report suspected vulnerabilities privately to security@kinpad.org instead.
  - type: input
    id: kinpad-version
    attributes:
      label: KinPad version
      placeholder: 2026.9.1
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use the smallest safe example.
      placeholder: |
        1. Open...
        2. Choose...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Sanitized context
      description: Add a short sanitized log or screenshot only when it helps.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private and sensitive information.
          required: true
